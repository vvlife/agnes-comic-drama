<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 剪辑成片 · Agnes 漫剧</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/sidebar.css">
<style>
.app{max-width:980px;margin:0 auto;padding:32px 24px 64px}

/* 页头 */
header{display:flex;align-items:center;gap:12px;padding:6px 0 22px}
header h1{font-size:24px;font-weight:800;letter-spacing:.3px}
header .spacer{flex:1}

/* 进入动画（复用 theme.css 的 @keyframes fadeIn） */
.enter{animation:fadeIn var(--transition-slow) both}
.enter-delay{animation-delay:.1s}

/* 成功徽章：大尺寸 pill + 脉冲光晕圆点 */
.success-pill{display:inline-flex;align-items:center;gap:10px;background:var(--success-bg);color:var(--success);
  border:1px solid rgba(46,204,143,.32);border-radius:999px;padding:10px 22px;font-size:15px;font-weight:700;
  margin-bottom:18px;box-shadow:0 0 24px rgba(46,204,143,.1)}
.success-pill .dot{width:10px;height:10px;border-radius:50%;background:var(--success);flex-shrink:0;
  animation:dotPulse 1.8s ease-out infinite}
@keyframes dotPulse{
  0%{box-shadow:0 0 0 0 rgba(46,204,143,.45)}
  70%{box-shadow:0 0 0 10px rgba(46,204,143,0)}
  100%{box-shadow:0 0 0 0 rgba(46,204,143,0)}
}

/* 视频容器：电影感暗角 + 圆角边框 + 悬浮光晕 */
.video-stage{position:relative;border-radius:var(--radius-lg);overflow:hidden;
  border:1px solid var(--border-strong);background:#000;box-shadow:var(--shadow-lg);
  transition:box-shadow var(--transition-base),border-color var(--transition-base)}
.video-stage:hover{box-shadow:var(--shadow-glow);border-color:var(--accent)}
.video-stage::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%)}
.result-video{width:100%;max-height:520px;display:block;background:#000}

/* 操作按钮组 */
.row{margin-top:18px;display:flex;gap:12px;flex-wrap:wrap}
.row .btn-primary,.row .btn-ghost{display:inline-flex;align-items:center;gap:8px}
.row svg{flex-shrink:0}

/* 元数据：键值对卡片 */
.meta{margin-top:20px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.meta-row{display:flex;gap:12px;font-size:13px}
.meta-row .k{width:56px;color:var(--text-muted);flex-shrink:0}
.meta-row .v{color:var(--text-primary);word-break:break-all}

/* 空状态 */
.empty .btn-primary{margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🎉 <span class="text-gradient">剪辑成片</span></h1>
    <div class="spacer"></div>
    <button class="btn-ghost" onclick="backToEditor()">✂️ 返回剪辑器</button>
    <button class="btn-primary" onclick="location.href='/'">🎭 生成器首页</button>
  </header>

  <div id="ok" class="card enter" style="display:none">
    <div class="success-pill"><span class="dot"></span>导出已完成</div>
    <div class="video-stage enter-delay">
      <video id="resultVideo" class="result-video" controls></video>
    </div>
    <div class="row">
      <a id="resultDl" class="btn-primary" download>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        下载成片
      </a>
      <button class="btn-ghost" onclick="copyPreview()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        复制预览链接
      </button>
    </div>
    <div class="meta">
      <div class="meta-row"><span class="k">项目</span><span class="v" id="mProject">—</span></div>
      <div class="meta-row"><span class="k">文件</span><span class="v" id="mFile">—</span></div>
    </div>
  </div>

  <div id="none" class="empty enter" style="display:none">
    <div class="empty-icon">🤔</div>
    <p>没有找到成片文件。</p>
    <button class="btn-primary" onclick="location.href='/'">🎭 打开生成器</button>
  </div>
</div>

<!-- 为共享侧边栏补齐全页导航函数（result.html 被识别为 gen 页） -->
<script>
  var RP_PID = new URLSearchParams(location.search).get('project') || '';
  var RP_FILE = new URLSearchParams(location.search).get('file') || '';
  window.showLanding = function(){ location.href = '/'; };
  window.openProjectsModal = function(){ location.href = '/#projects'; };
  window.openSettingsModal = function(){ location.href = '/#settings'; };
  window.openAutoModal = function(){ location.href = '/#auto'; };
  window.enterWorkspace = function(t){ location.href = '/' + (RP_PID ? '?project=' + encodeURIComponent(RP_PID) : '') + (t!=null ? '#tab' + t : ''); };
  function backToEditor(){ location.href = '/editor.html' + (RP_PID ? '?project=' + encodeURIComponent(RP_PID) : ''); }
  function copyPreview(){
    var url = location.origin + '/editor.html' + (RP_PID ? '?project=' + encodeURIComponent(RP_PID) : '');
    navigator.clipboard && navigator.clipboard.writeText(url);
    alert('已复制编辑器链接：\n' + url);
  }
  document.addEventListener('DOMContentLoaded', function(){
    if(RP_FILE){
      document.getElementById('resultVideo').src = RP_FILE;
      document.getElementById('resultDl').href = RP_FILE;
      document.getElementById('mProject').textContent = RP_PID || '—';
      document.getElementById('mFile').textContent = RP_FILE;
      document.getElementById('ok').style.display = 'block';
    } else {
      document.getElementById('none').style.display = 'block';
    }
  });
</script>
<script src="/sidebar.js"></script>
</body>
</html>
