<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 剪辑成片 · Agnes 漫剧</title>
<style>
:root{
  --bg:#0c0d12; --panel:#14151c; --panel2:#1b1d27; --panel3:#242736;
  --border:#2c2f3d; --text:#e9eaf2; --text2:#8b8fa3; --text3:#565a70;
  --accent:#7c6cff; --accent2:#a99bff; --ok:#2ecc8f; --err:#ff6b6b;
  --glow:rgba(124,108,255,.28);
  --sbw:214px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'SF Pro','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-left:var(--sbw);transition:padding-left .18s}
body.nav-collapsed{padding-left:66px}
a{color:var(--accent2);text-decoration:none}
button{cursor:pointer;border:none;border-radius:7px;font-size:13px;font-family:inherit;transition:.15s}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:13px;outline:none}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow)}
.app{max-width:980px;margin:0 auto;padding:28px 24px 60px}
header{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
header h1{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--accent),var(--ok));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header .spacer{flex:1}
.btn-primary{background:var(--accent);color:#fff;padding:10px 18px;font-weight:600}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:var(--panel2);color:var(--text);padding:9px 14px;border:1px solid var(--border);display:inline-flex;align-items:center;gap:6px}
.btn-ghost:hover{background:var(--panel3)}

.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(46,204,143,.12);color:var(--ok);
  border:1px solid rgba(46,204,143,.3);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;margin-bottom:16px}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(46,204,143,.18)}
.result-video{width:100%;max-height:520px;border-radius:12px;background:#000;display:block}
.row{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap}
.meta{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.meta-row{display:flex;gap:10px;font-size:13px;color:var(--text2)}
.meta-row .k{width:84px;color:var(--text3);flex-shrink:0}
.meta-row .v{color:var(--text);word-break:break-all}
.empty{text-align:center;padding:80px 20px;color:var(--text2)}
.empty .ic{font-size:48px;margin-bottom:14px}
</style>
<link rel="stylesheet" href="/sidebar.css">
</head>
<body>
<div class="app">
  <header>
    <h1>🎉 剪辑成片</h1>
    <div class="spacer"></div>
    <button class="btn-ghost" onclick="backToEditor()">✂️ 返回剪辑器</button>
    <button class="btn-primary" onclick="location.href='/'">🎭 生成器首页</button>
  </header>

  <div id="ok" class="card" style="display:none">
    <div class="badge"><span class="dot"></span>导出已完成，这是你的专属漫剧成片</div>
    <video id="resultVideo" class="result-video" controls></video>
    <div class="row">
      <a id="resultDl" class="btn-ghost" download>⬇️ 下载成片</a>
      <button class="btn-ghost" onclick="copyPreview()">🔗 复制预览链接</button>
    </div>
    <div class="meta">
      <div class="meta-row"><span class="k">项目</span><span class="v" id="mProject">—</span></div>
      <div class="meta-row"><span class="k">文件</span><span class="v" id="mFile">—</span></div>
    </div>
  </div>

  <div id="none" class="empty" style="display:none">
    <div class="ic">🤔</div>
    <p>没有找到成片文件。</p>
    <button class="btn-primary" style="margin-top:14px" onclick="location.href='/'">打开生成器</button>
  </div>
</div>

<!-- 为共享侧边栏补齐全页导航函数（result.html 被识别为 gen 页） -->
<script>
  var RP_PID = new URLSearchParams(location.search).get('project') || '';
  var RP_FILE = new URLSearchParams(location.search).get('file') || '';
  window.showLanding = function(){ location.href = '/'; };
  window.openProjectsModal = function(){ location.href = '/#projects'; };
  window.openSettingsModal = function(){ location.href = '/#settings'; };
  window.openAutoModal = function(){ location.href = '/#auto'; };
  window.enterWorkspace = function(t){ location.href = '/' + (RP_PID ? '?project=' + encodeURIComponent(RP_PID) : '') + (t!=null ? '#tab' + t : ''); };
  function backToEditor(){ location.href = '/editor.html' + (RP_PID ? '?project=' + encodeURIComponent(RP_PID) : ''); }
  function copyPreview(){
    var url = location.origin + '/editor.html' + (RP_PID ? '?project=' + encodeURIComponent(RP_PID) : '');
    navigator.clipboard && navigator.clipboard.writeText(url);
    alert('已复制编辑器链接：\n' + url);
  }
  document.addEventListener('DOMContentLoaded', function(){
    if(RP_FILE){
      document.getElementById('resultVideo').src = RP_FILE;
      document.getElementById('resultDl').href = RP_FILE;
      document.getElementById('mProject').textContent = RP_PID || '—';
      document.getElementById('mFile').textContent = RP_FILE;
      document.getElementById('ok').style.display = 'block';
    } else {
      document.getElementById('none').style.display = 'block';
    }
  });
</script>
<script src="/sidebar.js"></script>
</body>
</html>
